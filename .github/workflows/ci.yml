name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Delobytes.App.Backend.sln

      # Warnings that indicate a defect (nullable, dead code, broken XML-doc references) are
      # promoted to errors by Directory.Build.props, so this step is also the correctness gate.
      - name: Build (Release)
        run: dotnet build Delobytes.App.Backend.sln --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test tests/Delobytes.App.Backend.Tests/Delobytes.App.Backend.Tests.csproj
          --no-build
          --no-restore
          --configuration Release
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Run Integrations unit tests
        run: >
          dotnet test tests/Delobytes.App.Backend.Integrations.Tests/Delobytes.App.Backend.Integrations.Tests.csproj
          --no-build
          --no-restore
          --configuration Release
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=integrations-test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results and coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults/*.trx
            TestResults/**/coverage.cobertura.xml

  formatting:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Delobytes.App.Backend.sln

      # Whitespace only. Analyzer and style findings are already reported by the build job through
      # EnforceCodeStyleInBuild, so a second full analyzer pass would add minutes without new signal.
      - name: Verify formatting
        run: dotnet format whitespace Delobytes.App.Backend.sln --verify-no-changes --no-restore

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build only, no push: this job exists to catch Dockerfile defects that build and tests cannot
      # see — a props file missing from the COPY list broke restore with NU1015 while everything else
      # stayed green. BuildKit is required by the Dockerfile's cache mount.
      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --tag delobytes-app-backend:ci .
